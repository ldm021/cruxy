<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Puzzle Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-text">
                    <h1>Crossword Puzzle Generator</h1>
                    <p class="subtitle">Generate and solve crossword puzzles</p>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <div class="controls">
            <button id="generateBtn" class="btn btn-primary">Generate New Puzzle</button>
            <button id="checkBtn" class="btn btn-secondary" disabled>Check Answers</button>
            <button id="revealBtn" class="btn btn-secondary" disabled>Reveal Solution</button>

            <div class="generator-mode-control">
                <label>Generator Mode:</label>
                <div class="mode-options">
                    <label class="radio-label">
                        <input type="radio" name="generatorMode" value="standard" checked>
                        Standard Generator
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="generatorMode" value="advanced">
                        Advanced Heuristics
                    </label>
                </div>
            </div>

            <div class="grid-size-control">
                <label for="gridSize">Grid Size:</label>
                <select id="gridSize">
                    <option value="7">7x7</option>
                    <option value="9" selected>9x9</option>
                    <option value="11">11x11</option>
                    <option value="13">13x13</option>
                </select>
            </div>

            <div class="difficulty-control">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div id="metrics" class="metrics-container" style="display: none;">
            <h3>Generation Metrics</h3>
            <div class="metrics-grid">
                <div class="metric-item">
                    <span class="metric-label">Mode:</span>
                    <span id="metric-mode" class="metric-value">-</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Generation Time:</span>
                    <span id="metric-time" class="metric-value">-</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Words Placed:</span>
                    <span id="metric-words" class="metric-value">-</span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Grid Size:</span>
                    <span id="metric-size" class="metric-value">-</span>
                </div>
            </div>
        </div>

        <div id="puzzleContainer" class="puzzle-container">
            <div class="grid-section">
                <div class="grid-wrapper">
                    <div id="directionIndicator" class="direction-indicator">
                        <span class="direction-label">Direction:</span>
                        <span id="directionText" class="direction-text">Across</span>
                        <span class="direction-hint">(Click cell again or press Space to toggle)</span>
                    </div>
                    <div id="gridContainer" class="grid-container">
                        <!-- Grid will be generated here -->
                    </div>
                </div>
            </div>

            <div class="clues-section">
                <div class="clues-column">
                    <h2>Across</h2>
                    <div id="acrossClues" class="clues-list">
                        <!-- Across clues will be generated here -->
                    </div>
                </div>

                <div class="clues-column">
                    <h2>Down</h2>
                    <div id="downClues" class="clues-list">
                        <!-- Down clues will be generated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
