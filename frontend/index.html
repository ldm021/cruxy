<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Puzzle Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Crossword Puzzle Generator</h1>
            <p class="subtitle">Generate and solve crossword puzzles</p>
        </header>

        <div class="controls">
            <button id="generateBtn" class="btn btn-primary">Generate New Puzzle</button>
            <button id="checkBtn" class="btn btn-secondary" disabled>Check Answers</button>
            <button id="revealBtn" class="btn btn-secondary" disabled>Reveal Solution</button>

            <div class="hint-controls">
                <button id="hintBtn" class="btn btn-hint" disabled>Get Hint</button>
                <button id="hintCellBtn" class="btn btn-hint" disabled>Reveal Letter</button>
                <button id="hintWordBtn" class="btn btn-hint" disabled>Reveal Word</button>
                <span id="hintCounter" class="hint-counter">Hints used: 0</span>
            </div>

            <div class="language-control">
                <label for="language">Language:</label>
                <select id="language">
                    <option value="en" selected>English</option>
                    <option value="es">Español</option>
                    <option value="it">Italiano</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>

            <div class="grid-size-control">
                <label for="gridSize">Grid Size:</label>
                <select id="gridSize">
                    <option value="7">7x7</option>
                    <option value="9" selected>9x9</option>
                    <option value="11">11x11</option>
                    <option value="13">13x13</option>
                </select>
            </div>

            <div class="difficulty-control">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div id="puzzleContainer" class="puzzle-container">
            <div class="grid-section">
                <div class="grid-wrapper">
                    <div id="directionIndicator" class="direction-indicator">
                        <span class="direction-label">Direction:</span>
                        <span id="directionText" class="direction-text">Across</span>
                        <span class="direction-hint">(Click cell again or press Space to toggle)</span>
                    </div>
                    <div id="gridContainer" class="grid-container">
                        <!-- Grid will be generated here -->
                    </div>
                </div>
            </div>

            <div class="clues-section">
                <div class="clues-column">
                    <h2>Across</h2>
                    <div id="acrossClues" class="clues-list">
                        <!-- Across clues will be generated here -->
                    </div>
                </div>

                <div class="clues-column">
                    <h2>Down</h2>
                    <div id="downClues" class="clues-list">
                        <!-- Down clues will be generated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
